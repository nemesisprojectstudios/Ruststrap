[package]
name = "ruststrap"
version = "0.1.0"
edition = "2021"
description = "A native Rust rewrite of Froststrap, a cross-platform Roblox bootstrapper"
license = "MPL-2.0"
repository = "https://github.com/nemesisprojectstudios/Ruststrap"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
md-5 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate", "deflate64"] }
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
